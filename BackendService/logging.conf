[loggers]
keys=root,MatchingAlgorithms,DataModels,ApiEndpoints,BusinessServices,AsyncTasks,UtilityTools,LoggingSystem,audit,performance

[handlers]
keys=consoleHandler,fileHandler,errorHandler,matchingHandler,apiHandler,businessHandler,celeryHandler,utilsHandler,loggingHandler,auditHandler,performanceHandler

[formatters]
keys=detailedFormatter,jsonFormatter,simpleFormatter,auditFormatter,performanceFormatter

[logger_root]
level=INFO
handlers=consoleHandler,fileHandler,errorHandler

[logger_MatchingAlgorithms]
level=DEBUG
handlers=matchingHandler
qualname=MatchingAlgorithms
propagate=0

[logger_DataModels]
level=INFO
handlers=fileHandler
qualname=DataModels
propagate=0

[logger_ApiEndpoints]
level=INFO
handlers=apiHandler,consoleHandler
qualname=ApiEndpoints
propagate=0

[logger_BusinessServices]
level=INFO
handlers=businessHandler
qualname=BusinessServices
propagate=0

[logger_AsyncTasks]
level=INFO
handlers=celeryHandler,consoleHandler
qualname=AsyncTasks
propagate=0

[logger_UtilityTools]
level=WARNING
handlers=utilsHandler
qualname=UtilityTools
propagate=0

[logger_LoggingSystem]
level=INFO
handlers=loggingHandler
qualname=LoggingSystem
propagate=0

[logger_audit]
level=INFO
handlers=auditHandler
qualname=audit
propagate=0

[logger_performance]
level=INFO
handlers=performanceHandler
qualname=performance
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=detailedFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=handlers.RotatingFileHandler
level=INFO
formatter=jsonFormatter
args=('logs/app/app.log', 'a', 104857600, 10, 'utf-8')

[handler_errorHandler]
class=handlers.RotatingFileHandler
level=ERROR
formatter=jsonFormatter
args=('logs/error/error.log', 'a', 104857600, 10, 'utf-8')

[handler_matchingHandler]
class=handlers.RotatingFileHandler
level=DEBUG
formatter=detailedFormatter
args=('logs/matching/matching.log', 'a', 104857600, 10, 'utf-8')

[handler_apiHandler]
class=handlers.RotatingFileHandler
level=INFO
formatter=jsonFormatter
args=('logs/api/api.log', 'a', 104857600, 10, 'utf-8')

[handler_businessHandler]
class=handlers.RotatingFileHandler
level=INFO
formatter=jsonFormatter
args=('logs/business/business.log', 'a', 104857600, 10, 'utf-8')

[handler_celeryHandler]
class=handlers.RotatingFileHandler
level=INFO
formatter=jsonFormatter
args=('logs/celery/celery.log', 'a', 104857600, 10, 'utf-8')

[handler_utilsHandler]
class=handlers.RotatingFileHandler
level=WARNING
formatter=simpleFormatter
args=('logs/utils/utils.log', 'a', 104857600, 10, 'utf-8')

[handler_loggingHandler]
class=handlers.RotatingFileHandler
level=INFO
formatter=detailedFormatter
args=('logs/logging/logging.log', 'a', 104857600, 10, 'utf-8')

[handler_auditHandler]
class=handlers.RotatingFileHandler
level=INFO
formatter=auditFormatter
args=('logs/audit/audit.log', 'a', 104857600, 10, 'utf-8')

[handler_performanceHandler]
class=handlers.RotatingFileHandler
level=INFO
formatter=performanceFormatter
args=('logs/performance/performance.log', 'a', 104857600, 10, 'utf-8')

[formatter_detailedFormatter]
format=[%(asctime)s] [%(levelname)s] %(name)s %(funcName)s:%(lineno)d - %(message)s
datefmt=%Y-%m-%d %H:%M:%S

[formatter_jsonFormatter]
format={"timestamp": "%(asctime)s", "level": "%(levelname)s", "module": "%(name)s", "function": "%(funcName)s", "line": %(lineno)d, "message": "%(message)s"}
datefmt=%Y-%m-%d %H:%M:%S

[formatter_simpleFormatter]
format=%(levelname)s %(name)s - %(message)s

[formatter_auditFormatter]
format={"timestamp": "%(asctime)s", "type": "audit", "action": "%(message)s", "module": "%(name)s"}
datefmt=%Y-%m-%d %H:%M:%S

[formatter_performanceFormatter]
format={"timestamp": "%(asctime)s", "type": "performance", "module": "%(name)s", "function": "%(funcName)s", "message": "%(message)s"}
datefmt=%Y-%m-%d %H:%M:%S
