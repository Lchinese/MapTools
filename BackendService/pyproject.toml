[project]
name = "backendservice"
version = "0.1.0"
description = "Backend service for MapTools trajectory matching system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "geoalchemy2>=0.14.0",
    "celery[redis]>=5.3.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.6",
    "requests>=2.31.0",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.1.0",
    "mypy>=1.7.0",
]