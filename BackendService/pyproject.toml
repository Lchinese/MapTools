[project]
name = "backendservice"
version = "0.1.0"
description = "Backend service for MapTools trajectory matching system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "geoalchemy2>=0.14.0",
    "celery[redis]>=5.3.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",
    "requests>=2.31.0",
    "python-dotenv>=1.1.1",
    "aiofiles>=24.1.0",
    "gpxpy>=1.6.2",
    "folium>=0.20.0",
    "scikit-learn>=1.7.2",
    "httpx>=0.28.1",
    "psutil>=5.9.0",
    "cryptography>=41.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["*"]
exclude = ["Tests*", "Logs*", "scripts*", "examples*"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.1.0",
    "mypy>=1.7.0",
    "pre-commit>=4.3.0",
    "isort>=6.0.1",
]
